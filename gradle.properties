# SquadGym local configuration (not committed).
# Base URL used by the Android app. Emulator → host machine loopback:
squadgym.apiBaseUrl=http://10.0.2.2:8080/

# Raise Gradle memory for Compose + KSP builds
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 ships built-in Kotlin support. KSP still registers its generated sources
# through the kotlin.sourceSets DSL, so allow that DSL until KSP ships an
# AGP-9-native source registration.
android.disallowKotlinSourceSets=false
